[general]

import = [
		 # "~/.config/alacritty/catppuccin-mocha.toml", 
		 # "~/.config/alacritty/rosepine.toml" 
		 # "~/.config/alacritty/tokionight.toml" 
		 # "~/.config/alacritty/nord.toml" 
		 # "~/.config/alacritty/everforest.toml" 
		  "~/.config/alacritty/ayu-dark.toml" 
		 # "~/.config/alacritty/gotham-default.toml" 
		
]

[font]
size = 12.0

[keyboard]
bindings = [
  { key = "n", mods = "Alt", chars = "\u001b[D" }, # Alt+n → Left Arrow
  { key = "e", mods = "Alt", chars = "\u001b[B" }, # Alt+e → Down Arrow
  { key = "u", mods = "Alt", chars = "\u001b[A" }, # Alt+u → Up Arrow
  { key = "i", mods = "Alt", chars = "\u001b[C" }, # Alt+i → Right Arrow
]

