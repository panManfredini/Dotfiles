font_family JetBrainsMono Nerd Font
font_size 11.0


# BEGIN_KITTY_THEME
# Ayu
include current-theme.conf
# END_KITTY_THEME

# Alt+n → Left Arrow
map alt+n send_text all \x1b[D

# Alt+e → Down Arrow
map alt+e send_text all \x1b[B

# Alt+u → Up Arrow
map alt+u send_text all \x1b[A

# Alt+i → Right Arrow
map alt+i send_text all \x1b[C
